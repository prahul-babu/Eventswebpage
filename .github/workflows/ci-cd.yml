name: Apollo Event Hub CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Rules Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Cloud Functions Dependencies
        run: |
          cd functions
          npm ci
          cd ..

      - name: Lint Frontend
        run: npm run lint

      - name: Typecheck Frontend
        run: npx tsc -b

      - name: Typecheck Cloud Functions
        run: |
          cd functions
          npm run build
          cd ..

      - name: Run Firestore Security Rules Test Suite
        run: |
          npx firebase-tools emulators:exec --only firestore "npx vitest run test/rules.test.ts"

      - name: Build Frontend Production Artifact
        run: npm run build

  deploy-preview:
    name: Deploy Firebase Hosting Preview (PR)
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_APOLLO_DEV }}"
          projectId: apollo-event-hub-dev
          channelId: "pr-${{ github.event.number }}"

  deploy-production:
    name: Deploy to Production (Merge to Main)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci
          npm run build
          cd functions
          npm ci
          npm run build
          cd ..

      - name: Deploy All Services to Production
        uses: w9jds/firebase-action@master
        with:
          args: deploy --project apollo-event-hub-prod --only hosting,functions,firestore,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APOLLO_PROD }}
